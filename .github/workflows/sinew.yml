# Sinew: test the core, build the Godot extension for Windows + Linux, commit the binaries to
# addons/sinew/bin/ (so a plain pull runs in Godot with no compiler), then run the Godot suites.
name: sinew

on:
  push:
    # Only on main (merges): every push to a working branch cost a full Windows + Linux build.
    branches: [main]
    paths:
      - "sinew/**"
      - "bindings/**"
      - "addons/sinew/**"
      - ".github/workflows/sinew.yml"
      - "demo/characters/**"
      - "tests/suites/s*_sinew*.gd"
      - "demo/tours/sinew_moves_segments.gd"
      - "addons/marksman/**"
      - "tests/suites/g*_marksman.gd"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sinew-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build and test the core
        shell: bash
        run: |
          set +e
          { cmake -S sinew -B build/sinew -DCMAKE_BUILD_TYPE=Release &&
            cmake --build build/sinew --config Release -j4 &&
            ctest --test-dir build/sinew -C Release --output-on-failure; } 2>&1 | tee core.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            grep -iE "error|fatal|undefined|unresolved|failed" core.log | head -30 |
              while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          fi

  extension:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
          - os: ubuntu-22.04          # older glibc: the .so loads on more Linux systems
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build template_debug + template_release
        shell: bash
        run: |
          # Failing lines go out as annotations too (readable through the API without the log).
          set +e
          for t in template_debug template_release; do
            { cmake -S bindings/godot -B build/$t -DCMAKE_BUILD_TYPE=Release -DGODOTCPP_TARGET=$t &&
              cmake --build build/$t --config Release -j4; } 2>&1 | tee build-$t.log
            if [ ${PIPESTATUS[0]} -ne 0 ]; then
              grep -iE "error|fatal|undefined|unresolved" build-$t.log | grep -v "error_macros" | head -30 |
                while IFS= read -r line; do echo "::error::$t: ${line:0:900}"; done
              exit 1
            fi
          done
          ls -la addons/sinew/bin
      - uses: actions/upload-artifact@v4
        with:
          name: sinew-${{ matrix.name }}
          # ONLY this runner's own platform: the checkout also holds the other platform's committed
          # (stale) binaries, and the commit job merges every artifact - last one in wins.
          path: addons/sinew/bin/libsinew.${{ matrix.name }}.*
          if-no-files-found: error

  commit:
    needs: extension
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sinew-*
          path: addons/sinew/bin
          merge-multiple: true
      - name: Commit the binaries
        run: |
          # Every platform's debug + release library must be here, fresh from this run.
          for f in libsinew.windows.template_debug.x86_64.dll libsinew.windows.template_release.x86_64.dll \
                   libsinew.linux.template_debug.x86_64.so libsinew.linux.template_release.x86_64.so; do
            test -f addons/sinew/bin/$f || { echo "::error::missing $f"; exit 1; }
          done
          git config user.name "sinew-ci"
          git config user.email "sinew-ci@users.noreply.github.com"
          git add -f addons/sinew/bin/*.dll addons/sinew/bin/*.so
          if git diff --cached --quiet; then
            echo "binaries unchanged"
          else
            git commit -m "Sinew: CI-built extension binaries for ${GITHUB_SHA::8} [skip ci]"
            for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i * 5)); done
          fi

  godot:
    needs: extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sinew-linux
          path: addons/sinew/bin
      - name: Godot 4.7.1
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v4.7.1-stable_linux.x86_64" >> $GITHUB_ENV
      - name: Import
        run: timeout 1500 $GODOT --headless --path . --import || true
      # (s10 = the moves regression + the clip audit: legs through each other, hips, sinking into ramps /
      # stairs, and the reference clips against addons/sinew/clip_audit.json - see sinew/ANIMATION_GUIDE.md.)
      - name: Sinew + Marksman + menu suites
        run: |
          timeout 4800 $GODOT --headless --path . --fixed-fps 60 res://tests/test_runner.tscn -- --suite=s0,s2,s3,s4,s5,s6,s7,s8,s9,s10,g0,g1,g2,g3,g4,g5,g6,g7,g8,g9,g10,gm,pg,ui 2>&1 | tee test.log
          ! grep -q "SCRIPT ERROR" test.log
